name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres with PostGIS and pgvector
        run: |
          docker build -t sonic-postcards-db ./db
          docker run -d --name sonic-postcards-db -e POSTGRES_USER=sonic -e POSTGRES_PASSWORD=sonic -e POSTGRES_DB=sonic \
            -p 127.0.0.1:5506:5432 sonic-postcards-db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check app tests ../scripts
        working-directory: api
      - run: mypy app
        working-directory: api
      - name: Wait for the database, then run the tests
        working-directory: api
        run: |
          python -m app.db
          python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
